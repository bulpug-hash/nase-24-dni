<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
<title>24 dní</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: jeden úzký sloupec – číslo dne, období, galerie fotek z toho období, pod ní hra dne */
:root{--bg:#1F2A1C;--card:#27331f;--cream:#F3ECDD;--dim:#C9C1AE;--gold:#C8A15E;--gold2:#E8CB8C;--leaf:#8FA86A;
--disp:"Instrument Serif",Georgia,serif;--body:"Manrope",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,monospace;color-scheme:dark}
html,body{min-height:100%}body{margin:0}*{box-sizing:border-box}img{max-width:100%}
body{background:var(--bg);color:var(--cream);font-family:var(--body);font-size:15px;line-height:1.5;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:560px;margin:0 auto;padding-block:26px 60px;display:flex;flex-direction:column;gap:18px}
.ey{font:600 11px var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
.big{font:400 92px/.85 var(--disp);color:var(--gold2);margin:0}
.per{font:500 12px var(--mono);color:var(--dim)}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.gal img{width:100%;aspect-ratio:1;object-fit:cover;display:block;border-radius:3px;cursor:zoom-in}
h2{font:italic 400 28px/1.1 var(--disp);margin:8px 0 0}
.hint{color:var(--dim);font-size:13px;margin:0}
button{font:inherit;cursor:pointer}
.btn{background:var(--gold);color:var(--bg);border:0;border-radius:999px;padding:10px 18px;font-weight:700}
.btn:focus-visible,.tile:focus-visible,.opt:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
.score{font:600 12px var(--mono);color:var(--gold)}
/* puzzle */
.pz{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;max-width:100%;aspect-ratio:1}
.tile{border:0;padding:0;background-size:300% 300%;aspect-ratio:1}
.tile.sel{outline:3px solid var(--gold2);outline-offset:-3px}
/* pexeso */
.px{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.card{aspect-ratio:3/4;border-radius:6px;border:0;background:var(--card);background-size:cover;background-position:center;position:relative}
.card.down{background-image:none!important;background:linear-gradient(135deg,#3E5233,#2b3a24)}
.card.down::after{content:"";position:absolute;inset:30%;border:1px solid var(--gold);border-radius:50%}
/* zoom, mesic, drive, poradi */
.frame{width:100%;aspect-ratio:1;overflow:hidden;border-radius:8px;position:relative;background:#0004}
.frame img{width:100%;height:100%;object-fit:cover;transition:transform .7s ease}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{border:2px solid transparent;border-radius:8px;padding:0;background:var(--card);color:var(--cream);overflow:hidden}
.opt img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.opt.txt{padding:12px;font-weight:600}
.opt.ok{border-color:var(--leaf)}.opt.bad{opacity:.35}
.ord{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.ord .opt{position:relative}.ord .n{position:absolute;top:6px;left:6px;background:var(--gold);color:var(--bg);border-radius:999px;min-width:24px;height:24px;display:grid;place-items:center;font:700 13px var(--body)}
.ord .dt{position:absolute;bottom:0;left:0;right:0;background:#000a;font:500 11px var(--mono);padding:3px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
/* los */
.los{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden}
.los img{width:100%;height:100%;object-fit:cover}.los canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
/* lightbox */
.lb{position:fixed;inset:0;background:#000d;display:grid;place-items:center;z-index:20;padding:16px}
.lb img{max-width:100%;max-height:85vh;border-radius:6px}.lb p{font:500 12px var(--mono);color:var(--dim);text-align:center}
.home{text-align:center;padding-top:20vh}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head><body><div class="wrap" id="app"></div>
<div class="lb" id="lb" hidden><div><img id="lbi" alt=""><p id="lbt"></p></div></div>
<script>
let DATA=null;const app=document.getElementById("app");
const M=["ledna","února","března","dubna","května","června","července","srpna","září","října","listopadu","prosince"];
const MN=["leden","únor","březen","duben","květen","červen","červenec","srpen","září","říjen","listopad","prosinec"];
const fd=s=>{const[y,m,d]=s.split("-");return `${+d}. ${M[+m-1]} ${y}`};
const fm=s=>{const[y,m]=s.split("-");return `${MN[+m-1]} ${y}`};
const sh=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
function lb(f){document.getElementById("lbi").src=f.s;document.getElementById("lbt").textContent=fd(f.d);document.getElementById("lb").hidden=false}
document.getElementById("lb").onclick=()=>document.getElementById("lb").hidden=true;
let KEY=null,KS="";const cache={};
const b64=s=>{s=s.replace(/-/g,"+").replace(/_/g,"/");while(s.length%4)s+="=";return Uint8Array.from(atob(s),c=>c.charCodeAt(0))};
async function dec(url){const b=new Uint8Array(await (await fetch(url)).arrayBuffer());return crypto.subtle.decrypt({name:"AES-GCM",iv:b.slice(0,12)},KEY,b.slice(12))}
async function src(f){if(cache[f.s])return cache[f.s];const u=URL.createObjectURL(new Blob([await dec(f.s)],{type:"image/jpeg"}));cache[f.s]=u;return u}
async function boot(){const m=location.hash.match(/^#d(\d+)-([A-Za-z0-9_-]+)$/);if(!m){home();return}
 try{if(!KEY||KS!==m[2]){KEY=await crypto.subtle.importKey("raw",b64(m[2]),"AES-GCM",false,["decrypt"]);KS=m[2];DATA=JSON.parse(new TextDecoder().decode(await dec("d.bin")))}}catch(e){home();return}
 const D=DATA[+m[1]-1];if(!D){home();return}
 app.innerHTML='<p class="hint">Načítám…</p>';
 const fs=D.f.map(f=>({...f}));await Promise.all(fs.map(async f=>{f.s=await src(f)}));app.innerHTML="";day({...D,f:fs})}
function home(){app.innerHTML="";app.append(el("div","home",'<p class="ey">Adventní kalendář</p><p class="big">24</p><p class="hint">Naskenuj kód z domečku.</p>'))}
boot();addEventListener("hashchange",boot);
function day(D){
 app.append(el("p","ey","Den "+D.den),el("p","big",String(D.den)),el("p","per",fd(D.od)+(D.od!==D.do?" – "+fd(D.do):"")));
 const g=el("div","gal");D.f.forEach(f=>{const i=el("img");i.src=f.s;i.alt="Fotka z "+fd(f.d);i.loading="lazy";i.onclick=()=>lb(f);g.append(i)});app.append(g);
 const box=el("section");app.append(box);({puzzle,pexeso,zoom,poradi,drive,mesic,los,pribeh})[D.hra](box,D);
}
function head(box,t,h){box.append(el("h2",null,t),el("p","hint",h))}
function done(box,t){box.append(el("p","score",t))}
/* puzzle */
function puzzle(box,D){head(box,"Skládačka","Ťukni na dva dílky a prohodí se.");const f=D.f[0];let order=sh([...Array(9).keys()]);let sel=null;const g=el("div","pz");box.append(g);
 const draw=()=>{g.innerHTML="";order.forEach((p,i)=>{const b=el("button","tile"+(sel===i?" sel":""));b.style.backgroundImage=`url(${f.s})`;b.style.backgroundPosition=`${(p%3)*50}% ${Math.floor(p/3)*50}%`;b.setAttribute("aria-label","dílek "+(i+1));b.onclick=()=>{if(sel===null){sel=i}else{[order[sel],order[i]]=[order[i],order[sel]];sel=null}draw();if(order.every((p,i)=>p===i)){g.innerHTML="";const im=el("img");im.src=f.s;im.style.width="100%";im.style.borderRadius="8px";g.replaceWith(im);done(box,"Hotovo · "+fd(f.d))}};g.append(b)})};draw()}
/* pexeso */
function pexeso(box,D){head(box,"Pexeso","Najdi dvojice.");const n=Math.min(6,D.f.length);const cards=sh([...D.f.slice(0,n),...D.f.slice(0,n)].map((f,i)=>({f,k:f.s})));let open=[],found=0,moves=0;const g=el("div","px");box.append(g);const sc=el("p","score","tahy 0");box.append(sc);
 cards.forEach(c=>{const b=el("button","card down");b.setAttribute("aria-label","karta");b.style.backgroundImage=`url(${c.f.s})`;c.b=b;b.onclick=()=>{if(!b.classList.contains("down")||open.length===2)return;b.classList.remove("down");open.push(c);if(open.length===2){moves++;sc.textContent="tahy "+moves;if(open[0].k===open[1].k){found++;open=[];if(found===n)sc.textContent=`Hotovo za ${moves} tahů`}else setTimeout(()=>{open.forEach(o=>o.b.classList.add("down"));open=[]},800)}};g.append(b)})}
/* zoom */
function zoom(box,D){head(box,"Detail","Ze které fotky je ten výřez?");const pool=D.f.slice(0,Math.max(4,Math.min(8,D.f.length)));let r=0,ok=0;const rounds=Math.min(4,pool.length);const order=sh(pool).slice(0,rounds);
 const fr=el("div","frame"),im=el("img");fr.append(im);const op=el("div","opts"),sc=el("p","score");box.append(fr,op,sc);
 const next=()=>{if(r>=rounds){sc.textContent=`${ok} z ${rounds}`;op.innerHTML="";im.style.transform="none";return}const t=order[r];im.src=t.s;im.style.transformOrigin=`${20+Math.random()*60}% ${20+Math.random()*60}%`;im.style.transform="scale(4)";
  const ch=sh([t,...sh(pool.filter(x=>x!==t)).slice(0,3)]);op.innerHTML="";ch.forEach(c=>{const b=el("button","opt");const i=el("img");i.src=c.s;i.alt="";b.append(i);b.onclick=()=>{if(c===t){ok++;b.classList.add("ok")}else{b.classList.add("bad")}im.style.transform="none";r++;setTimeout(next,1100)};op.append(b)});sc.textContent=`kolo ${r+1} / ${rounds}`};next()}
/* poradi */
function poradi(box,D){head(box,"Seřaď","Ťukej od nejstarší fotky po nejnovější.");const ps=sh(D.f.slice(0,Math.min(6,D.f.length)));const right=[...ps].sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:0);let picked=[];const g=el("div","ord"),sc=el("p","score");box.append(g,sc);
 ps.forEach(f=>{const b=el("button","opt");const i=el("img");i.src=f.s;i.alt="";b.append(i);b.onclick=()=>{if(picked.includes(f))return;picked.push(f);const n=el("span","n",String(picked.length));b.append(n);if(picked.length===ps.length){let ok=0;picked.forEach((p,i)=>{if(p.d===right[i].d)ok++});[...g.children].forEach((c,i)=>c.append(el("span","dt",fd(ps[i].d))));sc.textContent=`${ok} z ${ps.length} na správném místě`}};g.append(b)})}
/* drive */
function drive(box,D){head(box,"Co bylo dřív?","Ťukni na starší fotku.");const fs=D.f;let r=0,ok=0;const rounds=Math.min(5,Math.floor(fs.length/2));const p=el("div","pair"),sc=el("p","score");box.append(p,sc);
 const pairs=[];const s=sh(fs);for(let i=0;i+1<s.length&&pairs.length<rounds;i+=2){if(s[i].d!==s[i+1].d)pairs.push([s[i],s[i+1]])}
 const next=()=>{if(r>=pairs.length){p.innerHTML="";sc.textContent=`${ok} z ${pairs.length}`;return}const [a,b]=pairs[r];p.innerHTML="";[a,b].forEach(f=>{const bt=el("button","opt");const i=el("img");i.src=f.s;i.alt="";bt.append(i,el("span","dt",""));bt.onclick=()=>{const old=a.d<b.d?a:b;if(f===old){ok++;bt.classList.add("ok")}else bt.classList.add("bad");[...p.children].forEach((c,k)=>c.querySelector(".dt").textContent=fd([a,b][k].d));r++;setTimeout(next,1300)};bt.style.position="relative";p.append(bt)});sc.textContent=`kolo ${r+1} / ${pairs.length}`};next()}
/* mesic */
function mesic(box,D){head(box,"Kdy to bylo?","Vyber měsíc.");const all=[...new Set(DATA.flatMap(x=>x.f.map(f=>f.d.slice(0,7))))];const fs=sh(D.f).slice(0,4);let r=0,ok=0;const fr=el("div","frame"),im=el("img");fr.append(im);const op=el("div","opts"),sc=el("p","score");box.append(fr,op,sc);
 const next=()=>{if(r>=fs.length){op.innerHTML="";sc.textContent=`${ok} z ${fs.length}`;return}const f=fs[r];im.src=f.s;const m=f.d.slice(0,7);const ch=sh([m,...sh(all.filter(x=>x!==m)).slice(0,3)]);op.innerHTML="";ch.forEach(c=>{const b=el("button","opt txt",fm(c+"-01"));b.onclick=()=>{if(c===m){ok++;b.classList.add("ok")}else{b.classList.add("bad");[...op.children].forEach(x=>{if(x.textContent===fm(m+"-01"))x.classList.add("ok")})}r++;setTimeout(next,1100)};op.append(b)});sc.textContent=`kolo ${r+1} / ${fs.length}`};next()}
/* los */
function los(box,D){head(box,"Stírací los","Setři zlatou vrstvu prstem.");const f=D.f[0];const w=el("div","los"),i=el("img"),c=el("canvas");i.src=f.s;i.alt="";w.append(i,c);box.append(w);
 requestAnimationFrame(()=>{const r=c.getBoundingClientRect(),dp=devicePixelRatio||1;c.width=r.width*dp;c.height=r.height*dp;const x=c.getContext("2d");const g=x.createLinearGradient(0,0,c.width,c.height);g.addColorStop(0,"#8E6B35");g.addColorStop(.45,"#E8CB8C");g.addColorStop(.55,"#C8A15E");g.addColorStop(1,"#7A5A2A");x.fillStyle=g;x.fillRect(0,0,c.width,c.height);x.globalCompositeOperation="destination-out";let dn=false;const sc=e=>{const b=c.getBoundingClientRect();x.beginPath();x.arc((e.clientX-b.left)*dp,(e.clientY-b.top)*dp,28*dp,0,7);x.fill()};c.addEventListener("pointerdown",e=>{dn=true;c.setPointerCapture(e.pointerId);sc(e)});c.addEventListener("pointermove",e=>{if(dn)sc(e)});c.addEventListener("pointerup",()=>dn=false)})}
/* pribeh */
function pribeh(box,D){head(box,"Celý náš příběh","Všechny fotky z kalendáře od první po poslední.");const all=DATA.flatMap(x=>x.f).sort((a,b)=>a.d<b.d?-1:1);let i=0,t=null;const fr=el("div","frame"),im=el("img");fr.append(im);const dt=el("p","score"),row=el("div","opts");const pl=el("button","btn","Přehrát"),nx=el("button","btn","Další");row.append(pl,nx);box.append(fr,dt,row);
 const show=async()=>{const k=i;im.src=await src(all[k]);dt.textContent=`${fd(all[k].d)} · ${k+1} / ${all.length}`;if(all[k+1])src(all[k+1])};show();
 nx.onclick=()=>{i=(i+1)%all.length;show()};pl.onclick=()=>{if(t){clearInterval(t);t=null;pl.textContent="Přehrát"}else{t=setInterval(()=>{i=(i+1)%all.length;show()},1800);pl.textContent="Pauza"}}}
</script>

</body></html>
